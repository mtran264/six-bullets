  --denim-indigo: #2F3F5C; --denim-mid: #4F6D8F; --denim-wash: #A9BCD0; --border: #CBBDA4; --border-strong: #A99678; --border-subtle: #DED3BF; --subtle: #F0E7D6;

#app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 8px; }
.brand { font-family: var(--display); color: var(--walnut); font-size: 16px; }
.brand.big { font-size: 30px; }
.brand.logo { font-size: 30px; }
.greet { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 400; color: var(--walnut); }
.meta { font-family: var(--ui); font-size: 12px; color: var(--ink-muted); }
.view { flex: 1; padding: 8px 18px 96px; display: flex; flex-direction: column; gap: 12px; }
.h { font-size: 17px; font-weight: 500; color: var(--walnut); margin: 0; }
.muted, .note { color: var(--ink-muted); font-size: 13px; margin: 0; }
.count { font-family: var(--ui); font-size: 13px; color: var(--ink-muted); margin: 0; }
.active { background: var(--paper); border: 4px solid var(--brass-light); border-radius: 0; padding: 19px 17px 3px; display: flex; flex-direction: column; gap: 14px; }
.tag-now { margin: 0; display: flex; align-items: center; gap: 8px; font-family: "Roboto Slab", Georgia, serif; font-size: 14px; color: var(--leather); }
.tag-now svg { width: 1em; height: 1em; flex-shrink: 0; }
.active-text { margin: 0; font-family: "Roboto Slab", Georgia, serif; font-size: 15px; font-weight: 500; color: var(--walnut); }
.all-done { background: var(--positive-bg); border: 0.5px solid var(--positive-border); color: var(--positive); border-radius: 0; padding: 14px; }
.list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
.row { background: var(--paper); border: 0.5px solid var(--border); border-radius: 0; padding: 16px 16px; min-height: 68px; display: flex; align-items: center; gap: 12px; font-size: 16px; }
.row.done { background: var(--positive-bg); border-color: var(--positive-border); color: var(--positive); }

.num { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: none; font-family: var(--mono); font-size: 13px; color: var(--paper); background: var(--denim-mid); }
.txt { flex: 1; font-family: "Roboto Slab", Georgia, serif; font-size: 14px; }
.stamp { font-size: 10px; background: var(--warning-bg); color: var(--warning); border: 0.5px solid var(--warning-border); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.lock { display: inline-flex; align-items: center; gap: 6px; font-family: "Roboto Slab", Georgia, serif; font-size: 12px; color: var(--leather); white-space: nowrap; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
button { font: inherit; font-family: "Roboto Slab", Georgia, serif; cursor: pointer; border-radius: 999px; border: 0.5px solid var(--border-strong); background: transparent; color: var(--walnut); padding: 8px 14px; }
button:active { transform: scale(0.98); }
button.primary { background: var(--brass); border-color: var(--brass); color: var(--paper); font-weight: 500; }
button.secondary { background: transparent; }
button.wide { width: 100%; }
button.cta { display: inline-flex; font-style: normal; align-items: center; justify-content: center; width: auto; padding: 12px 26px; border: none; border-radius: 0; background: var(--denim-mid); color: var(--paper); font-family: "Roboto Slab", Georgia, serif; font-weight: 500; font-size: 15px; letter-spacing: 0.04em; transform: skewX(-15deg); box-shadow: 6px 6px 0 var(--brass-light); transition: box-shadow 0.5s, transform 0.2s; }
button.cta:hover { box-shadow: 6px 6px 0 var(--brass-light); }
button.cta:active { transform: skewX(-15deg) scale(0.98); }
button.cta:focus { outline: none; }
button.cta:focus-visible { outline: 2px solid var(--info); outline-offset: 4px; }
button.cta > span { display: inline-flex; align-items: center; transform: skewX(15deg); }
button.cta > span:nth-child(2) { margin-left: 12px; margin-right: 0; transition: margin-right 0.5s; }
button.cta:hover > span:nth-child(2) { margin-right: 24px; }
button.cta .cta-arrow svg { width: 33px; height: 22px; display: block; }
button.cta .cta-arrow path { fill: var(--brass-light); transition: 0.4s; }
button.cta .cta-arrow path.one { transform: translateX(-60%); }
button.cta .cta-arrow path.two { transform: translateX(-30%); transition: 0.5s; }
button.cta:hover .cta-arrow path.one { transform: translateX(0%); animation: color_anim 1s infinite 0.6s; }
button.cta:hover .cta-arrow path.two { transform: translateX(0%); animation: color_anim 1s infinite 0.4s; }
button.cta:hover .cta-arrow path.three { animation: color_anim 1s infinite 0.2s; }
@keyframes color_anim { 0% { fill: var(--brass-light); } 50% { fill: var(--brass); } 100% { fill: var(--brass-light); } }
button.cta[data-act="complete"] > span:nth-child(2) { margin-right: 24px; }
button.cta[data-act="complete"] .cta-arrow path.one { transform: translateX(0%); animation: color_anim 1s infinite 0.6s; }
button.cta[data-act="complete"] .cta-arrow path.two { transform: translateX(0%); animation: color_anim 1s infinite 0.4s; }
button.cta[data-act="complete"] .cta-arrow path.three { animation: color_anim 1s infinite 0.2s; }
button.icon { border: none; padding: 4px 6px; border-radius: 6px; font-size: 14px; color: var(--ink-muted); }
button.link { border: none; padding: 0; color: var(--brass); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two button[data-act="ob-start"][data-when="today"].cta { padding-left: 26px !important; }
.two button[data-act="ob-start"][data-when="today"].cta > .cta-arrow { display: none; }
.two button[data-act="ob-start"][data-when="tomorrow"] { background: var(--paper); border-color: var(--border); box-shadow: 4px 4px 0 var(--walnut); }
form[data-form="ob-add"] button.cta { padding-left: 26px !important; }
form[data-form="ob-add"] button.cta > .cta-arrow { display: none; }
.view form[data-form="add"] button.cta > .cta-arrow,
.view button[data-act="lock"].is-locked > .cta-arrow { display: none; }
form { display: flex; gap: 8px; align-items: center; transform: skewX(-15deg); margin: 0 10px; padding: 6px 8px; background: var(--paper); border: 0.5px solid var(--border); box-shadow: 4px 4px 0 var(--walnut); }
form > * { transform: skewX(15deg); }
form > button.cta, form > button.cta > span { transform: none; }
form input[type=text] { background: var(--paper); border: 0.5px solid var(--border-strong); border-radius: 4px; }
input[type=text], input:not([type]), textarea { flex: 1; font: inherit; padding: 9px 12px; border-radius: 8px; border: 0.5px solid var(--border-strong); background: var(--paper); color: var(--ink); min-width: 0; }
input:focus, button:focus-visible, textarea:focus { outline: 2px solid var(--info); outline-offset: 2px; }
.err { background: var(--error-bg); border: 0.5px solid var(--error-border); color: var(--error); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 0; }
.info { background: var(--denim-wash); border: 0.5px solid var(--denim-mid); color: var(--denim-indigo); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 0; }
.card-row { background: var(--paper); border: 0.5px solid var(--border); border-radius: 0; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; color: var(--ink); text-align: left; border-radius: 8px; }
.card-row.col { flex-direction: column; align-items: stretch; }
.between { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.links { display: flex; gap: 14px; font-size: 13px; }
.seg { display: flex; background: var(--subtle); padding: 3px; gap: 2px; transform: skewX(-15deg); margin: 0 10px; box-shadow: 4px 4px 0 var(--walnut); }
.import-btn { display: flex; align-items: center; justify-content: center; padding: 10px 14px; border: 0.5px solid var(--border-strong); background: var(--paper); color: var(--walnut); font-size: 14px; cursor: pointer; transform: skewX(-15deg); box-shadow: 4px 4px 0 var(--walnut); }
.import-btn > span { transform: skewX(15deg); }
.seg button { flex: 1; border: none; padding: 6px 4px; font-size: 13px; color: var(--ink-muted); }
.seg button.on { background: var(--denim-indigo); color: var(--paper); }
.seg > button { transform: skewX(15deg); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--walnut); display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); max-width: 440px; margin: 0 auto; }
.tabs button { background: transparent; border: none; color: var(--paper); font-size: 12px; padding: 8px 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ph { display: block; width: 22px; height: 22px; border: 1px dashed currentColor; border-radius: 6px; }
.tabs button.on { color: var(--brass-light); }
.tab-icon svg { width: 22px; height: 22px; display: block; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 8px; background: var(--paper); border-radius: 12px; border: 0.5px solid var(--border); }
.bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 10px; color: var(--ink-muted); font-family: var(--mono); }
.bar { width: 100%; background: var(--positive-border); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar.empty { background: var(--border-subtle); }
.stat { background: var(--paper); border: 0.5px solid var(--border); border-radius: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .big { font-family: var(--mono); font-size: 22px; color: var(--walnut); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.steps-bar { display: flex; gap: 4px; }
.steps-bar span { flex: 1; height: 4px; border-radius: 2px; background: var(--border-subtle); }
.steps-bar span.on { background: var(--brass); }
.ob { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.welcome { flex: 1; margin-top: 40px; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.welcome-copy { width: 100%; }
.welcome-copy .torn-pi { align-items: center; }
.welcome-copy .motto { margin-bottom: 0; }
.rules-copy { width: 100%; }
.welcome .cta { margin-top: auto; }
.ob > button[data-act="ob-next"] { margin-top: auto; margin-bottom: 24px; }
.ob > .two { order: 2; margin-top: auto; margin-bottom: 24px; }
.ob-step-3 { height: 100vh; height: 100dvh; }
.ob-step-3 > .torn { order: 0; flex: 1 1 0; min-height: 0; overflow-y: auto; }
.ob-step-3 .two button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.ob-step-4 > button[data-act="ob-finish"].primary { margin-top: auto; padding-left: 26px !important; }
.ob-step-4 > button[data-act="ob-finish"].primary > .cta-arrow { display: none; }
.ob-step-4 > button[data-act="ob-finish"].secondary { background: var(--paper); border-color: var(--border); box-shadow: 4px 4px 0 var(--walnut); margin-bottom: 24px; }
.motto { color: var(--ink-muted); margin: 0 0 16px; }
.rules { padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px; width: min(400px, calc(100% - 32px)); background: var(--denim-indigo); border: 0.5px solid var(--denim-mid); color: var(--paper); border-radius: 4px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: "Roboto Slab", Georgia, serif; font-size: 13px; z-index: 5; }
.toast[hidden] { display: none; }
.toast button { border: none; color: var(--denim-wash); font-weight: 500; padding: 4px 6px; }
.toast.warn { background: var(--denim-indigo); border-color: var(--denim-mid); color: var(--paper); }
textarea.json { width: 100%; min-height: 110px; font-family: var(--mono); font-size: 11px; }
/* Unslanted UI with a 4px corner radius */
.cta, .cta > span, .row, .row > *, .card-row, .card-row > *, .stat, .stat > *, form, form > *, .seg, .seg > *, .import-btn, .import-btn > *, .info, .err, .toast, .bars, button, input, textarea, label { transform: none !important; }
.row, .active, .card-row, .stat, .all-done, form, .seg, .import-btn { margin-left: 0 !important; margin-right: 0 !important; }
button, input, textarea, .row, .active, .card-row, .stat, .all-done, form, .seg, .import-btn, .info, .err, .toast, .bars, .tabs, .tabs button, .ph { border-radius: 4px !important; }
button.cta:active { transform: scale(0.98) !important; }
button.cta { padding-left: 42px !important; }
.side-logo { display: none; }
.list { order: 1; }
.active { order: 2; position: relative; perspective: 900px; }
.torn { order: 1; filter: drop-shadow(4px 4px 0 var(--walnut)); }
.torn-inner { background: var(--paper); padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
.torn-inner > .list { box-shadow: none !important; border: none !important; background: transparent !important; }
.count-row { display: flex; align-items: center; gap: 16px; }
.sort-btn { display: inline-flex; align-items: center; gap: 8px; border: none; background: var(--denim-mid); color: var(--paper); font-family: "Roboto Slab", Georgia, serif; font-weight: 500; font-size: 14px; padding: 8px 14px; border-radius: 4px; cursor: pointer; box-shadow: 4px 4px 0 var(--brass); }
.sort-btn svg { width: 1em; height: 1em; }
.sort-btn.on { background: var(--denim-indigo); color: var(--paper); }
.row.done .num svg { width: 16px; height: 16px; }
.row.done .num { background: var(--positive); }
.date-stamp { font-family: "Roboto Slab", Georgia, serif; font-size: 14px; color: var(--ink-muted); }
.active { transform: none; transform-style: preserve-3d; display: grid; }
.active .face { grid-area: 1 / 1; position: relative; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; gap: 14px; }
.active > .face.front { background: var(--paper); transform: none; }
.active > .face.back { transform: rotateY(180deg); background: var(--paper); color: var(--leather); align-items: center; justify-content: center; min-height: 140px; }
.active .bounty { margin: 0; font-family: "Roboto Slab", Georgia, serif; font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
.face .badge { top: -23px; right: -21px; }
.active .bounty { position: relative; top: -12px; }
.active:not(.flipping), .active:not(.flipping) > .face.front, .face .badge { transform: none !important; }
.view { perspective: 1000px; }
.active.flipping { animation: flip-cycle 1.8s ease-in-out; }
@keyframes flip-cycle { 0% { transform: rotateY(0deg); } 33% { transform: rotateY(180deg); } 66% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
.badge { position: absolute; top: -4px; right: -4px; background: var(--leather); color: var(--paper); font-family: "Roboto Slab", Georgia, serif; font-size: 12px; font-weight: 700; padding: 4px 10px; }
.list { gap: 0 !important; background: var(--paper); border: 0.5px solid var(--border); box-shadow: 4px 4px 0 var(--walnut); border-radius: 4px; }
.list > .row { border: none !important; border-top: 0.5px solid var(--border-subtle) !important; box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; min-height: 60px; }
.list > .row:first-child { border-top: none !important; }
.section-label, .count { font-family: "Roboto Slab", Georgia, serif; font-size: 20px; font-weight: 700; color: var(--walnut); margin: 0; }
@media (min-width: 900px) { .side-logo { display: block; padding: 4px 22px 24px 12px; font-size: 18px; color: #FFFFFF; white-space: nowrap; } }
.ro .row { cursor: default; }
svg text { font-family: var(--mono); font-size: 10px; fill: var(--ink-muted); }
@media (min-width: 900px) {
  #app { max-width: 1120px; margin: 0 0 0 232px; }
  .view { width: 100%; padding: 32px 40px 48px; max-width: 640px; margin: 0 auto; }
  .top { padding: 28px 40px 0; max-width: 880px; margin: 0 auto; width: 100%; }
  .tabs { top: 0; right: auto; bottom: 0; width: 200px; max-width: none; margin: 0; flex-direction: column; justify-content: flex-start; gap: 4px; padding: 28px 14px; }
  .tabs button { flex-direction: row; justify-content: flex-start; width: 100%; font-size: 14px; padding: 10px 12px; gap: 12px; }
  .toast { left: calc(50% + 116px); bottom: 24px; }
}

const TABS = [['today','Today'],['plan','Plan'],['settings','Settings']];

let S = load();
let UI = { tab: 'today', range: 'week', hist: 'days', filter: 'all', open: null, err: '', undo: null, tt: null, imp: null, ob: { step: 1, tasks: [] }, autoMsg: '' };

let DL = null;
function dayOf(k) { return S.days[k] || { locked: false, tasks: [] }; }
function ensureDay(k) { return S.days[k] || (S.days[k] = { locked: false, tasks: [] }); }

// Rollover: unfinished tasks move to the next day's top, in order. Carryovers never push out a locked plan.
function rollover() {

  const t = todayKey();

    const to = ensureDay(n);
    const earlier = to.tasks.filter(x => x.carried);
    const planned = to.tasks.filter(x => !x.carried);

    while (to.tasks.length > MAX) {
      let idx = -1;
      for (let i = to.tasks.length - 1; i >= 0; i--) if (to.tasks[i].carried) { idx = i; break; }

  const tk = todayKey();

function addTask(k, text) {
  const d = ensureDay(k);

}

function nextOpenKey() {
  const tk = todayKey();
  for (let i = 1; i <= 60; i++) {
    const k = addDays(tk, i), d = S.days[k];
    if (d && (d.locked || d.tasks.length >= MAX)) continue;
    return k;
  }
  return null;
}
function droppedHTML() {
  const items = S.dropLog.filter(x => !x.dismissed && x.status !== 'planned');
  if (!items.length) return '';
  const open = nextOpenKey();
  const openCount = open && S.days[open] ? S.days[open].tasks.length : 0;
  return `<div class="dropped">
    <div class="head"><p class="section-label">Dropped</p><span class="meta">${items.length} open</span></div>
    <ol class="list">${items.map(x => {
      const waiting = x.status === 'waiting';
      const sub = waiting ? 'Waiting for a board' : `Dropped ${label(x.fromKey)}${x.origin === 'auto' ? ', to make room' : ''}`;
      let action;
      if (UI.confirm === x.id) {
        action = open
          ? `<div class="confirm"><p class="note">Put "${esc(x.text)}" on ${label(open)}? That board has ${openCount} of ${MAX} planned.</p>
             <div class="links"><button class="primary" data-act="again" data-id="${x.id}">Place on ${label(open)}</button><button class="secondary" data-act="cancel-confirm">Cancel</button></div></div>`
          : `<p class="note">No open board yet. Unlock a day to place this task.</p>`;
      } else {
        action = `<div class="links"><button class="link" data-act="${waiting ? 'confirm' : 'again'}" data-id="${x.id}">Plan again</button><button class="link" data-act="dismiss" data-id="${x.id}">Dismiss</button></div>`;
      }
      return `<li class="row dropped-item${waiting ? ' waiting' : ''}"><div class="dropped-body">
        <div class="between"><span class="txt">${esc(x.text)}</span><span class="tag-origin">${x.origin === 'auto' ? 'Automatic' : 'By you'}</span></div>
        <p class="meta" style="margin:0">${sub}</p>${action}</div></li>`;
    }).join('')}</ol></div>`;
}

function emptyState(withButton) {
  return `<div class="empty-state"><img class="empty-art" src="${EMPTY_ART}" alt=""><p class="empty-title">No Bounties Posted</p><p class="empty-copy">Your bounty board is empty. Round up a few tasks to get started.</p>${withButton ? '<button class="primary wide" data-act="tab" data-tab="plan">Set Tomorrow\'s Plan</button>' : ''}</div>`;
}
function tornBox(html, plain) {
  if (plain) return `<div class="plan-plain">${html}</div>`;
  return `<div class="torn-pi-wrap"><div class="torn-pi">${html}</div></div>`;
}
function planHTML(tm) {
  const d = dayOf(tm), tasks = d.tasks, full = tasks.length >= MAX;
  const head = `<div class="head"><div><p class="h">Bounties</p><p class="meta">${label(tm)} · ${tasks.length} of ${MAX} planned</p></div>
    <span class="lock">${d.locked ? LOCK_ICON : UNLOCK_ICON}${d.locked ? 'Locked' : 'Unlocked'}</span></div>
    ${UI.err ? `<p class="err">${esc(UI.err)}</p>` : ''}
    ${full ? `<p class="note">Six is the limit, partner. Swap one out to add another.</p>` : `<form data-form="add" data-key="${tm}"><input type="text" name="text" placeholder="Add a task" maxlength="120" autocomplete="off"><button class="add-btn" type="submit"><svg width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>Add</button></form>`}`;
  const list = `<ol class="list">${tasks.length ? tasks.map((t, i) => row(t, i, tasks, tm, 'plan')).join('') : `<li class="empty-li">${emptyState(false)}</li>`}</ol>
    <p class="note">Editing unlocks the board. Re-lock it when finished. Carried-over tasks always appear above newly added tasks.</p>`;
  return `${tornBox(head, true)}
    ${tornBox(list)}
    <button class="primary wide${d.locked ? ' is-locked' : ''}" data-act="lock" data-key="${tm}"${!d.locked && !tasks.length ? ' disabled' : ''}>${d.locked ? 'Unlock to Edit' : 'Lock In Tomorrow'}</button>${droppedHTML()}`;
}

function settingsHTML() {
  const dayStart = S.dayStart ?? 6;
  const hourLabel = h => h === 0 ? '12:00 am' : `${h}:00 am`;
  const hours = Array.from({ length: 10 }, (_, h) => `<option value="${h}"${h === dayStart ? ' selected' : ''}>${hourLabel(h)}</option>`).join('');
  let preview = '';
  if (UI.imp) {
    const keys = Object.keys(UI.imp.data.days).sort();
    preview = `<div class="set-card"><p class="set-title">Import preview</p>
      <p class="meta">${keys.length} days from ${keys.length ? label(keys[0]) : 'none'} to ${keys.length ? label(keys[keys.length - 1]) : 'none'}.</p>
      <p class="err">Importing replaces everything on this device with this backup.</p>
      <div class="set-actions"><button class="danger" data-act="iapply">Replace with backup</button><button class="secondary" data-act="icancel">Cancel</button></div></div>`;
  }
  const clear = UI.clearing ? `<div class="set-card"><p class="set-title">Clear all data</p>
      <p class="note">This removes every day, task, and drop from this device. Export a backup first if you want to keep them.</p>
      <button class="sort-btn wide" data-act="export">Export backup</button>
      <input type="text" id="clearWord" placeholder="Type CLEAR to confirm" autocomplete="off">
      <div class="set-actions"><button id="clearBtn" class="danger" data-act="clear-confirm" disabled>Clear all data</button><button class="secondary" data-act="clear-cancel">Cancel</button></div></div>` : '';
  return `<div class="set-card"><p class="set-title">Planning</p>
      <div class="set-row"><div><p class="h">Day starts at</p><p class="note">Changes take effect at the next day boundary.</p></div>
      <select id="dayStart" aria-label="Day starts at">${hours}</select></div></div>
    <div class="set-card"><p class="set-title">Your data</p>
      <button class="sort-btn wide" data-act="export">Export backup</button>
      <label class="import-btn"><span>Import backup</span><input id="importFile" type="file" accept="application/json,.json" hidden></label>
      ${UI.err ? `<p class="err">${esc(UI.err)}</p>` : ''}
      <p class="note">Your data stays on this device until you export it.</p>
      <button class="danger wide" data-act="clear-open">Clear all data</button>
    </div>
    ${preview}${clear}
    <div class="set-card"><p class="set-title">About</p><p class="note">Six Bullets, version 1.1</p></div>`;
}
function onboardingHTML() {
  const s = UI.ob.step;
  const bar = `<div class="steps-bar">${[1,2,3,4].map(i => `<span class="${i <= s ? 'on' : ''}"></span>`).join('')}</div><p class="meta">Step ${s} of 4</p>`;
  let body = '';
  if (s === 1) body = `<div class="welcome"><div class="welcome-copy torn-pi-wrap"><div class="torn-pi"><span class="brand big">Six Bullets</span><p class="motto">Make every bullet count.</p></div></div><button class="primary wide" data-act="ob-next">Saddle up</button></div>`;
  if (s === 2) body = `<div class="rules-copy torn-pi-wrap"><div class="torn-pi"><p class="h">Each evening, plan tomorrow</p><ul class="rules"><li>Six tasks at most. Fewer is fine.</li><li>Lock in to commit. Edits unlock it.</li><li>Unfinished tasks carry over to the top.</li></ul></div></div><button class="primary wide" data-act="ob-next">Continue</button>`;
  if (s === 3) {
    const disabled = UI.ob.tasks.length ? '' : ' disabled';
    const boardForm = `<p class="h">Plan your first board</p>
      ${UI.err ? `<p class="err">${esc(UI.err)}</p>` : ''}
      <form data-form="ob-add"><input type="text" name="text" placeholder="Add a task" maxlength="120" autocomplete="off"><button class="add-btn" type="submit"><svg width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>Add</button></form>`;
    const taskCards = UI.ob.tasks.length ? `<ol class="list ob-rows">${UI.ob.tasks.map((t, i) => `<li class="row"><span class="num">${i + 1}</span><span class="txt">${esc(t)}</span><button class="icon" data-act="ob-rm" data-i="${i}" aria-label="Remove task">✕</button></li>`).join('')}</ol>` : emptyState(false);
    body = `${tornBox(boardForm, true)}
      ${taskCards}
      <div class="two"><button class="primary" data-act="ob-start" data-when="today"${disabled}>Start today</button><button class="secondary" data-act="ob-start" data-when="tomorrow"${disabled}>Start tomorrow</button></div>`;
  }
  if (s === 4) body = `${tornBox(`<p class="h">Add Six Bullets to your home screen</p><p>One tap to check in on today and plan tomorrow, from wherever you are.</p><p class="note">On your browser, open the menu. For iPhone, tap Share. On Android, tap <b>More</b>. Then, choose <b>Add to Home Screen</b>. On some Android phones, it says <b>Install app</b>. Tap <b>Add</b>, and the app icon appears on your home screen.</p>`)}
    <button class="primary wide" data-act="ob-finish">Already Added</button><button class="secondary wide" data-act="ob-finish">Maybe Later</button>`;
  return `<section class="ob ob-step-${s}">${bar}${body}</section>`;
}

function render() { renderBase(); decorateCTA(); }
function renderBase() {
  const app = $('#app');
  if (!S.start || !S.obDone) { app.innerHTML = onboardingHTML(); return; }
  const tk = todayKey(), tm = addDays(tk, 1);
  const body = UI.tab === 'today' ? todayHTML(tk) : UI.tab === 'plan' ? planHTML(tm) : settingsHTML();
  app.innerHTML = `<header class="top"><p class="greet">${greeting(UI.tab)}</p>${UI.tab === 'today' ? `<button class="sort-btn${UI.sort ? ' on' : ''}" data-act="sort"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="M6.227 11h11.547c.862 0 1.32-1.02.747-1.665L12.748 2.84a.998.998 0 0 0-1.494 0L5.479 9.335C4.906 9.98 5.364 11 6.227 11m5.026 10.159a.998.998 0 0 0 1.494 0l5.773-6.495c.574-.644.116-1.664-.747-1.664H6.227c-.862 0-1.32 1.02-.747 1.665z"/></svg>Sort</button>` : ''}</header>
    <section class="view">${body}</section>
    <nav class="tabs" aria-label="Main"><span class="brand logo side-logo">Six Bullets</span>${TABS.map(([id, l]) => `<button data-act="tab" data-tab="${id}" class="${UI.tab === id ? 'on' : ''}" aria-current="${UI.tab === id ? 'page' : 'false'}"><span class="tab-icon" aria-hidden="true">${ICONS[id]}</span>${l}</button>`).join('')}</nav>`;
}

const CTA_ARROW = '<svg width="33" height="22" viewBox="0 0 66 43" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill-rule="evenodd"><path class="one" d="M40.1543933,3.89485454 L43.9763149,0.139296592 C44.1708311,-0.0518420739 44.4826329,-0.0518571125 44.6771675,0.139262789 L65.6916134,20.7848311 C66.0855801,21.1718824 66.0911863,21.8050225 65.704135,22.1989893 C65.7000188,22.2031791 65.6958657,22.2073326 65.6916762,22.2114492 L44.677098,42.8607841 C44.4825957,43.0519059 44.1708242,43.0519358 43.9762853,42.8608513 L40.1545186,39.1069479 C39.9575152,38.9134427 39.9546793,38.5968729 40.1481845,38.3998695 C40.1502893,38.3977268 40.1524132,38.395603 40.1545562,38.3934985 L56.9937789,21.8567812 C57.1908028,21.6632968 57.193672,21.3467273 57.0001876,21.1497035 C56.9980647,21.1475418 56.9959223,21.1453995 56.9937605,21.1432767 L40.1545208,4.60825197 C39.9574869,4.41477773 39.9546013,4.09820839 40.1480756,3.90117456 C40.1501626,3.89904911 40.1522686,3.89694235 40.1543933,3.89485454 Z"/><path class="two" d="M20.1543933,3.89485454 L23.9763149,0.139296592 C24.1708311,-0.0518420739 24.4826329,-0.0518571125 24.6771675,0.139262789 L45.6916134,20.7848311 C46.0855801,21.1718824 46.0911863,21.8050225 45.704135,22.1989893 C45.7000188,22.2031791 45.6958657,22.2073326 45.6916762,22.2114492 L24.677098,42.8607841 C24.4825957,43.0519059 24.1708242,43.0519358 23.9762853,42.8608513 L20.1545186,39.1069479 C19.9575152,38.9134427 19.9546793,38.5968729 20.1481845,38.3998695 C20.1502893,38.3977268 20.1524132,38.395603 20.1545562,38.3934985 L36.9937789,21.8567812 C37.1908028,21.6632968 37.193672,21.3467273 37.0001876,21.1497035 C36.9980647,21.1475418 36.9959223,21.1453995 36.9937605,21.1432767 L20.1545208,4.60825197 C19.9574869,4.41477773 19.9546013,4.09820839 20.1480756,3.90117456 C20.1501626,3.89904911 20.1522686,3.89694235 20.1543933,3.89485454 Z"/><path class="three" d="M0.154393339,3.89485454 L3.97631488,0.139296592 C4.17083111,-0.0518420739 4.48263286,-0.0518571125 4.67716753,0.139262789 L25.6916134,20.7848311 C26.0855801,21.1718824 26.0911863,21.8050225 25.704135,22.1989893 C25.7000188,22.2031791 25.6958657,22.2073326 25.6916762,22.2114492 L4.67709797,42.8607841 C4.48259567,43.0519059 4.17082418,43.0519358 3.97628526,42.8608513 L0.154518591,39.1069479 C-0.0424848215,38.9134427 -0.0453206733,38.5968729 0.148184538,38.3998695 C0.150289256,38.3977268 0.152413239,38.395603 0.154556228,38.3934985 L16.9937789,21.8567812 C17.1908028,21.6632968 17.193672,21.3467273 17.0001876,21.1497035 C16.9980647,21.1475418 16.9959223,21.1453995 16.9937605,21.1432767 L0.15452076,4.60825197 C-0.0425130651,4.41477773 -0.0453986756,4.09820839 0.148075568,3.90117456 C0.150162624,3.89904911 0.152268631,3.89694235 0.154393339,3.89485454 Z"/></g></svg>';
function tornClip() {
  const offs = [0, 4, 1, 5, 2, 6, 0, 3, 5, 1, 4, 2];
  const n = 36, pts = [];
  for (let i = 0; i <= n; i++) pts.push(`${(i / n * 100).toFixed(2)}% ${offs[i % offs.length]}px`);
  for (let i = 0; i <= n; i++) pts.push(`calc(100% - ${offs[(i + 3) % offs.length]}px) ${(i / n * 100).toFixed(2)}%`);
  for (let i = n; i >= 0; i--) pts.push(`${(i / n * 100).toFixed(2)}% calc(100% - ${offs[(i + 5) % offs.length]}px)`);
  for (let i = n; i >= 0; i--) pts.push(`${offs[(i + 7) % offs.length]}px ${(i / n * 100).toFixed(2)}%`);
  return `polygon(${pts.join(', ')})`;
}
function wrapTorn() {
  if (UI.tab !== 'today') return;
  const list = document.querySelector('#app .list');
  if (!list || (list.parentElement && list.parentElement.classList.contains('torn-inner'))) return;
  const head = document.querySelector('#app .count-row');
  const outer = document.createElement('div');
  outer.className = 'torn';
  const inner = document.createElement('div');
  inner.className = 'torn-inner';
  const first = head && head.parentNode === list.parentNode ? head : list;
  list.parentNode.insertBefore(outer, first);
  outer.appendChild(inner);
  if (first !== list) inner.appendChild(head);
  inner.appendChild(list);
  inner.style.clipPath = tornClip();
}
function decorateCTA() {
  wrapTorn();
  document.querySelectorAll('#app .torn-pi').forEach(el => { if (!el.style.clipPath) el.style.clipPath = tornClip(); });
  document.querySelectorAll('button.primary:not(.no-arrow)').forEach(b => {
    b.classList.add('cta');
    b.innerHTML = `<span>${b.innerHTML}</span><span class="cta-arrow">${CTA_ARROW}</span>`;
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, k = b.dataset.key;
  UI.allDoneFx = false;
  UI.err = (a === 'tab' || a === 'range' || a === 'hist' || a === 'filter') ? '' : UI.err;
  switch (a) {
    case 'sort': UI.sort = !UI.sort; break;
    case 'export': exportBackup(); break;
    case 'clear-open': UI.clearing = true; UI.imp = null; break;
    case 'clear-cancel': UI.clearing = false; break;
    case 'clear-confirm': clearAll(); break;
    case 'tab': UI.tab = b.dataset.tab; break;
    case 'range': UI.range = b.dataset.range; break;
    case 'hist': UI.hist = b.dataset.hist; break;
    case 'filter': UI.filter = b.dataset.filter; break;
    case 'open': UI.open = UI.open === k ? null : k; break;
    case 'complete': completeTask(id); break;
    case 'move': moveTask(k, id, Number(b.dataset.dir)); break;
    case 'remove': removeTask(k, id); break;
    case 'lock': { const d = ensureDay(k); if (d.locked) d.locked = false; else if (!d.tasks.length) UI.err = 'Add a task before locking in.'; else { d.locked = true; toast("Tomorrow's board is set. Get some shut-eye.", null); } break; }
    case 'uncomplete': { const t = dayOf(todayKey()).tasks.find(x => x.id === id); if (t) { t.done = false; t.doneOn = null; } break; }
    case 'undo': if (UI.undo) UI.undo(); $('#toast').hidden = true; break;
    case 'again': { const x = S.dropLog.find(z => z.id === id); UI.confirm = null; if (x) { placeLog(x); toast(x.status === 'planned' ? `Added to ${label(x.plannedKey)}. Saved in your history.` : 'No open board yet. Saved as waiting.', null, x.status !== 'planned'); } break; }
    case 'confirm': UI.confirm = id; break;
    case 'cancel-confirm': UI.confirm = null; break;
    case 'dismiss': { const x = S.dropLog.find(z => z.id === id); if (x) x.dismissed = true; break; }
    case 'ob-next': UI.ob.step++; break;
    case 'ob-rm': UI.ob.tasks.splice(Number(b.dataset.i), 1); break;
    case 'ob-start': startJourney(b.dataset.when, UI.ob.tasks); UI.ob.step = 4; break;
    case 'ob-finish': S.obDone = true; if (UI.autoMsg) { toast(UI.autoMsg, null, true); UI.autoMsg = ''; } break;
    case 'imode': UI.imp.mode = b.dataset.mode; break;
    case 'iall': UI.imp.choice = b.dataset.choice; UI.imp.per = {}; break;
    case 'iday': UI.imp.per[k] = b.dataset.choice; break;
    case 'icancel': UI.imp = null; break;
    case 'iapply': applyImport(); break;
    case 'selectjson': { const ta = document.querySelector('textarea.json'); if (ta) { ta.focus(); ta.select(); } break; }
  }
  save(); render();
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset.form) return;
  e.preventDefault();
  const text = (f.elements.text.value || '').trim();
  if (!text) return;
  if (f.dataset.form === 'add') addTask(f.dataset.key, text);
  if (f.dataset.form === 'ob-add') { if (UI.ob.tasks.length >= MAX) UI.err = 'Six is the limit, partner. Swap one out to add another.'; else { UI.ob.tasks.push(text); UI.err = ''; } }
  save(); render();
});

document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.days !== 'object' || !Array.isArray(data.dropLog)) throw new Error('shape');
    UI.imp = { data, mode: 'merge', choice: 'device', per: {} };
    UI.err = '';
  } catch (err) {
    UI.imp = null;
    UI.err = 'This file can\'t be read. Choose another backup. Nothing was changed.';
  }
  save(); render();
});

async function exportBackup() {
  const payload = { app: 'Six Bullets', version: 2, exportedAt: new Date().toISOString(), start: S.start, lastKey: S.lastKey, obDone: S.obDone, dayStart: S.dayStart ?? 6, days: S.days, dropLog: S.dropLog };
  try {
    const filename = 'six-bullets-backup-' + todayKey() + '.json';
    const data = JSON.stringify(payload, null, 2);
    if (DL) {
      await DL.save({ filename, data });
    } else {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    toast('Backup saved.');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast('Backup could not be saved. Try again.', null, true);
  }
}
function applyImport() {
  const im = UI.imp;
  if (!im) return;
  const d = im.data;
  S = { start: d.start || null, lastKey: d.lastKey || null, obDone: true, dayStart: d.dayStart ?? 6, days: d.days, dropLog: d.dropLog };
  UI.imp = null;
  const n = rollover();
  if (n) UI.autoMsg = `The corral's full. ${n} ${n === 1 ? 'task' : 'tasks'} rode out. Saved in your ledger.`;
  tryWaiting();
  UI.err = '';
}
function clearAll() {
  S = fresh();
  UI.clearing = false;
  UI.imp = null;
  UI.err = '';
}

document.addEventListener('change', e => {
  if (e.target.id !== 'dayStart') return;
  S.dayStart = Number(e.target.value); save(); render();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'clearWord') return;
  const b = document.querySelector('#clearBtn');
  if (b) b.disabled = e.target.value !== 'CLEAR';
});
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(d => { DL = d; render(); }).catch(() => {});
}
// Start-up
if (S.start && S.obDone) {
  const n = rollover();
  if (n) UI.autoMsg = `The corral's full. ${n} ${n === 1 ? 'task' : 'tasks'} rode out. Saved in your ledger.`;
  tryWaiting();
  save();
}
render();
if (S.start && S.obDone && UI.autoMsg) { toast(UI.autoMsg, null, true); UI.autoMsg = ''; }
</script>
